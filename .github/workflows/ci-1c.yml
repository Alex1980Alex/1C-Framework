name: CI 1C:Enterprise

on:
  push:
    branches: [master, main, develop, dev-master]
    paths:
      - 'configuration/**'
      - 'src/bsl/**'
      - 'features/**'
      - 'tools/vanessa/**'
      - 'tools/yaxunit.json'
      - '.github/workflows/ci-1c.yml'
  pull_request:
    branches: [master, main, develop, dev-master]
    # Same paths filter as push (added 2026-06-12): without it EVERY PR queued
    # 1C jobs — eternally, because no self-hosted runner is registered.
    paths:
      - 'configuration/**'
      - 'src/bsl/**'
      - 'features/**'
      - 'tools/vanessa/**'
      - 'tools/yaxunit.json'
      - '.github/workflows/ci-1c.yml'
  workflow_dispatch:

env:
  ONEC_PATH: 'C:\Program Files\1cv8\8.3.27.1859\bin'
  OSCRIPT_PATH: 'C:\Tools\OneScript\bin\oscript.exe'
  VRUNNER_PATH: 'C:\Tools\OneScript\bin\vrunner.bat'
  PROJECT_PATH: 'D:\1C-FW'
  BSL_SRC: 'D:\1C-FW\src\projects\configuration\260304_GKSTCPLK-2182 Доработать создание Направление на разгрузку для заблокированных ТС\src'
  IB_CONNECTION: '/SKOMPUTER\testdb1c'

jobs:
  # ═══════════════════════════════════════════════
  # BSL Static Analysis (BSL LS + SonarQube)
  # ═══════════════════════════════════════════════
  bsl-analysis:
    name: BSL Static Analysis
    runs-on: [self-hosted, windows-11, 1c]
    # Runner-gate (2026-06-12): репо имеет 0 self-hosted runner'ов → без гейта
    # джобы висят QUEUED вечно на каждом PR. Когда runner зарегистрирован:
    #   gh variable set CI_1C_RUNNER_ONLINE --body 1
    # (env paths выше указывают на до-миграционный D:\1C-FW — при оживлении
    # runner'а обновить на C:\1С-Framework.)
    if: ${{ vars.CI_1C_RUNNER_ONLINE == '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run BSL Language Server
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          New-Item -ItemType Directory -Force -Path "${{ env.PROJECT_PATH }}\build\bsl-report" | Out-Null
          java -jar "${{ env.PROJECT_PATH }}\tools\bsl-ls\bsl-language-server.jar" `
            --analyze `
            --srcDir "${{ env.BSL_SRC }}" `
            --reporter json `
            --outputDir "${{ env.PROJECT_PATH }}\build\bsl-report"

      - name: Run Sonar Scanner
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $scannerBin = "${{ env.PROJECT_PATH }}\tools\sonar-scanner-6.2.1.4610-windows-x64\bin\sonar-scanner.bat"
          if (Test-Path $scannerBin) {
            & $scannerBin `
              "-Dsonar.host.url=http://localhost:9000" `
              "-Dsonar.token=$env:SONAR_TOKEN" `
              "-Dsonar.projectBaseDir=${{ env.PROJECT_PATH }}"
          } else {
            Write-Host "sonar-scanner not found, skipping SonarQube upload" -ForegroundColor Yellow
          }

      - name: Upload BSL Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsl-report
          path: build/bsl-report/

  # ═══════════════════════════════════════════════
  # YAxUnit Unit Tests (Layer 3: server logic)
  # ═══════════════════════════════════════════════
  yaxunit-tests:
    name: YAxUnit Tests
    runs-on: [self-hosted, windows-11, 1c]
    # Runner-gate (2026-06-12): репо имеет 0 self-hosted runner'ов → без гейта
    # джобы висят QUEUED вечно на каждом PR. Когда runner зарегистрирован:
    #   gh variable set CI_1C_RUNNER_ONLINE --body 1
    # (env paths выше указывают на до-миграционный D:\1C-FW — при оживлении
    # runner'а обновить на C:\1С-Framework.)
    if: ${{ vars.CI_1C_RUNNER_ONLINE == '1' }}
    env:
      MSYS_NO_PATHCONV: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run YAxUnit
        shell: pwsh
        env:
          USER_1C: ${{ secrets.USER_1C_LOGIN }}
          PASS_1C: ${{ secrets.USER_1C_PASS }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          & "${{ env.VRUNNER_PATH }}" `
            run `
            --ibconnection "${{ env.IB_CONNECTION }}" `
            --db-user "$env:USER_1C" `
            --db-pwd "$env:PASS_1C" `
            --command "RunUnitTests" `
            --execute "${{ env.PROJECT_PATH }}\tools\vanessa\YAxUnit-25.12.cfe" `
            --settings "${{ env.PROJECT_PATH }}\tools\yaxunit.json"

      - name: Upload YAxUnit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaxunit-report
          path: build/reports/junit.xml

  # ═══════════════════════════════════════════════
  # BDD Tests (Vanessa Automation — Layers 1-3)
  # ═══════════════════════════════════════════════
  bdd-tests:
    name: BDD Tests
    runs-on: [self-hosted, windows-11, 1c]
    # Runner-gate (2026-06-12): репо имеет 0 self-hosted runner'ов → без гейта
    # джобы висят QUEUED вечно на каждом PR. Когда runner зарегистрирован:
    #   gh variable set CI_1C_RUNNER_ONLINE --body 1
    # (env paths выше указывают на до-миграционный D:\1C-FW — при оживлении
    # runner'а обновить на C:\1С-Framework.)
    if: ${{ vars.CI_1C_RUNNER_ONLINE == '1' }}
    continue-on-error: true  # BDD tests are less stable (GUI-dependent)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run BDD Tests
        shell: pwsh
        env:
          USER_1C: ${{ secrets.USER_1C_LOGIN }}
          PASS_1C: ${{ secrets.USER_1C_PASS }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          powershell -File "${{ env.PROJECT_PATH }}\tools\vanessa\run-bdd.ps1"

      - name: Upload BDD Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-report
          path: |
            build/reports/bdd-junit.xml
            build/reports/screenshots/

  # ═══════════════════════════════════════════════
  # Coverage41C (code coverage, after tests)
  # ═══════════════════════════════════════════════
  coverage:
    name: Code Coverage (Coverage41C)
    runs-on: [self-hosted, windows-11, 1c]
    needs: [yaxunit-tests]
    # Gate (2026-06-15, ADR-020): runner online И тесты прошли. Coverage41C ТРЕБУЕТ
    # EDT_LOCATION — plugins/ ПОЛНОГО 1C:EDT IDE (даёт com._1c.g5.v8.dt.debug.* на
    # classpath; EDT Lite / components-only → Coverage41C.bat падает NoClassDefFoundError).
    # Активация на self-hosted runner'е:
    #   gh variable set CI_1C_RUNNER_ONLINE --body 1
    #   gh variable set EDT_LOCATION --body '<1C_EDT_IDE>\plugins'
    #   gh variable set COVERAGE_IB_ALIAS --body '<debugger-infobase-alias>'
    # См. tools/coverage41c/README.md. (битый 9-байт coverage41c.jar в корне НЕ использовать.)
    # env paths выше указывают на до-миграционный D:\1C-FW — при оживлении обновить на C:\1С-Framework.
    if: ${{ vars.CI_1C_RUNNER_ONLINE == '1' && needs.yaxunit-tests.result == 'success' }}
    continue-on-error: true  # coverage опционально, пока dbgs+EDT_LOCATION не стабильны
    env:
      EDT_LOCATION: ${{ vars.EDT_LOCATION }}
      IB_ALIAS: ${{ vars.COVERAGE_IB_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Coverage41C prerequisites
        id: check-coverage
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $bat = "${{ env.PROJECT_PATH }}\tools\coverage41c\Coverage41C-2.7.3\bin\Coverage41C.bat"
          $ok = $true
          if (-not (Test-Path $bat)) { Write-Host "::warning::Coverage41C.bat не найден: $bat"; $ok = $false }
          if ([string]::IsNullOrWhiteSpace($env:EDT_LOCATION)) {
            Write-Host "::warning::EDT_LOCATION не задан (нужен plugins/ полного 1C:EDT IDE; tools/coverage41c/README.md)"; $ok = $false
          } elseif (-not (Test-Path $env:EDT_LOCATION)) {
            Write-Host "::warning::EDT_LOCATION путь не существует: $env:EDT_LOCATION"; $ok = $false
          }
          echo "available=$($ok.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Run Coverage
        if: steps.check-coverage.outputs.available == 'true'
        shell: pwsh
        env:
          USER_1C: ${{ secrets.USER_1C_LOGIN }}
          PASS_1C: ${{ secrets.USER_1C_PASS }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $bat = "${{ env.PROJECT_PATH }}\tools\coverage41c\Coverage41C-2.7.3\bin\Coverage41C.bat"
          $out = "${{ env.PROJECT_PATH }}\build\reports\genericCoverage.xml"
          $dbgs = "${{ env.ONEC_PATH }}\dbgs.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null

          # Start debug server (dbgs:1550)
          $dbgsProc = Start-Process -FilePath $dbgs -ArgumentList "--addr=localhost","--port=1550" -PassThru
          Start-Sleep -Seconds 5
          try {
            # Coverage41C.bat строит classpath из EDT_LOCATION (debug-плагины)
            & "$bat" start -i "$env:IB_ALIAS" -u "http://localhost:1550" -P "${{ env.BSL_SRC }}" -o "$out"

            # Прогон YAxUnit между start и stop
            & "${{ env.VRUNNER_PATH }}" `
              run `
              --ibconnection "${{ env.IB_CONNECTION }}" `
              --db-user "$env:USER_1C" `
              --db-pwd "$env:PASS_1C" `
              --command "RunUnitTests" `
              --execute "${{ env.PROJECT_PATH }}\tools\vanessa\YAxUnit-25.12.cfe" `
              --settings "${{ env.PROJECT_PATH }}\tools\yaxunit.json"

            # Stop coverage → genericCoverage.xml
            & "$bat" stop -i "$env:IB_ALIAS" -u "http://localhost:1550"
          } finally {
            Stop-Process -Id $dbgsProc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Coverage Report
        if: always() && steps.check-coverage.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/genericCoverage.xml

  # ═══════════════════════════════════════════════
  # Allure Report (aggregates all test results)
  # ═══════════════════════════════════════════════
  allure-report:
    name: Allure Report
    runs-on: [self-hosted, windows-11, 1c]
    # Runner-gate (2026-06-12): репо имеет 0 self-hosted runner'ов → без гейта
    # джобы висят QUEUED вечно на каждом PR. Когда runner зарегистрирован:
    #   gh variable set CI_1C_RUNNER_ONLINE --body 1
    # (env paths выше указывают на до-миграционный D:\1C-FW — при оживлении
    # runner'а обновить на C:\1С-Framework.)
    needs: [bsl-analysis, yaxunit-tests, bdd-tests, coverage]
    # runner-gate + always() в ОДНОМ if (дубль ключа раньше затирал gate → job висел QUEUED)
    if: ${{ vars.CI_1C_RUNNER_ONLINE == '1' && always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: build/allure-results
          merge-multiple: true

      - name: Generate Allure Report
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          allure generate build/allure-results -o build/allure-report --clean

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/allure-report/

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'BSL Analysis': '${{ needs.bsl-analysis.result }}',
              'YAxUnit Tests': '${{ needs.yaxunit-tests.result }}',
              'BDD Tests': '${{ needs.bdd-tests.result }}'
            };

            let table = '| Job | Result |\n|-----|--------|\n';
            for (const [job, result] of Object.entries(results)) {
              const emoji = result === 'success' ? '✅' : result === 'failure' ? '❌' : '⚠️';
              table += `| ${job} | ${emoji} ${result} |\n`;
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI 1C:Enterprise Results\n\n${table}\n\nAllure report available in build artifacts.`
            });
