name: Python CI

on:
  push:
    branches: [main, master, dev-master]
  pull_request:
    branches: [main, master, dev-master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Ruff lint
        # scripts/ + .claude/hooks/ included since 2026-06: the merge/autofix
        # regression landed broken code in those paths, which `src/`-only lint
        # never saw. RUF100/PGH004 (noqa hygiene) now guard the masking vector.
        run: ruff check src/ scripts/ .claude/hooks/

      - name: Ruff format check
        run: ruff format --check src/

      - name: Compile-smoke (scripts + hooks)
        # Byte-compiles every script/hook to catch merge-mangling that is
        # syntactically/structurally broken (e.g. the benchmark scripts in the
        # 2026-06 regression). compileall does NOT execute imports, so it stays
        # dep-free and CI-stable. The complementary class — undefined names from
        # deleted/renamed symbols (the reindex_bsl_qwen3.py regression) — is
        # caught by the Ruff lint step above (F821 now runs on scripts/).
        run: python -m compileall -q scripts .claude/hooks

      - name: TOC ↔ filesystem consistency
        run: python scripts/validate_toc.py --json

      - name: Roadmap §18 progress-log lint
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            # Explicit refspec materializes origin/<base> even on single-branch checkout.
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" || true
            python scripts/roadmap_progress_log.py lint --base "origin/${{ github.base_ref }}"
          else
            python scripts/roadmap_progress_log.py lint --no-freshness
          fi

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,qdrant,morphology]"

      - name: mypy
        run: mypy src/
        continue-on-error: true  # strict mode may have existing violations

  mypy-baseline:
    name: Type Check (mypy-baseline ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,qdrant,morphology]"

      # Ratchet gate: fails if mypy total error count grows or if any error
      # not present in mypy-baseline.txt is introduced. Re-sync the baseline
      # with the SAME exclude as the filter step below (2026-06-12: dropped
      # stray src/api/auth/ from this recipe — sync from a SUBSET produced a
      # baseline that the superset filter failed on):
      #   mypy src/ --ignore-missing-imports --warn-return-any \
      #     --exclude '(tests/|docs/|scripts/|src/pdf_framework/quick\.py$)' \
      #     | python -m mypy_baseline sync
      # then commit mypy-baseline.txt.
      - name: mypy-baseline filter
        run: |
          # NO pipefail: mypy itself exits non-zero (many errors), but
          # mypy_baseline filter is the authoritative gate (exits 0 if new=0).
          # With pipefail, mypy's exit code masks filter's PASS verdict.
          python -m mypy src/ \
            --ignore-missing-imports --warn-return-any \
            --exclude '(tests/|docs/|scripts/|src/pdf_framework/quick\.py$)' \
            | python -m mypy_baseline filter --allow-unsynced

  docstrings:
    name: Docstring Coverage (interrogate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: interrogate
        run: interrogate src/ -v

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,qdrant,morphology]"

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  test-unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    # Unit tests gate merges. No external services required. (roadmap 260509 §2.5)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,morphology]"

      - name: Run unit tests
        run: pytest tests/ -v -m "unit and not slow" --cov=src --cov-report=term --cov-report=xml

      - name: Retrieval smoke gate (schema validation)
        # Quality NDCG gate активируется когда golden_v1.json ≥ 50 items.
        # До тех пор — schema validation. Roadmap 260509 §2.1.
        run: pytest tests/eval/test_smoke_gate.py -v

      - name: DeepEval gate (schema validation)
        # Faithfulness/hallucination gate активируется при установленном [eval]
        # extra И golden_v1 с ≥ 50 items и ground-truth chunk_ids.
        # До тех пор — schema validation. Roadmap 260509 §3.9.
        run: pytest tests/eval/test_deepeval.py -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unit
          name: codecov-unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage XML artifact (unit)
        # Belt-and-suspenders: artifact даже если Codecov upload fails (rate limit / network).
        # Retention 30d для local download + offline review.
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

  test-integration:
    name: Integration Tests (Python ${{ matrix.python-version }})
    # Integration tests are best-effort: external services (Qdrant) may flake. (roadmap 260509 §2.5)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      qdrant:
        image: qdrant/qdrant:v1.17.1
        ports:
          - 6333:6333
        # No docker `--health-cmd` — the qdrant 1.12.0 image is distroless
        # and lacks both `curl` and `wget`. Previous attempts with `/health`
        # (removed in 1.10) and even `/readyz` failed because the binaries
        # weren't there to issue the request. Without a healthcheck, GitHub
        # Actions still waits for the service to bind its port (6333) before
        # starting the test job; if qdrant fails to start, pytest will fail
        # to connect on its own. Test code handles connect retries via
        # `continue-on-error: true` on this job.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,qdrant,morphology]"

      - name: Run integration & e2e tests
        run: pytest tests/ -v -m "integration or e2e" --cov=src --cov-report=term --cov-report=xml
        env:
          VECTOR_STORE__PROVIDER: qdrant
          VECTOR_STORE__QDRANT_URL: http://localhost:6333

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: integration
          name: codecov-integration
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage XML artifact (integration)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

  security-audit:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies + pip-audit
        run: |
          uv pip install --system -e ".[dev,qdrant,morphology]"
          uv pip install --system pip-audit

      - name: Audit installed packages
        run: pip-audit --strict
        continue-on-error: true  # advisory; fix CVSS >= 7.0 within 7 days, medium in next iteration

  skill-router-eval:
    name: Skill Router Evaluation
    runs-on: ubuntu-latest
    continue-on-error: true  # eval requires ground-truth data not in repo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run skill-router evaluation
        run: |
          if [ -f data/skill-router-ground-truth.jsonl ]; then
            python scripts/eval-skill-router.py --json > eval-result.json 2>&1 || true
          else
            echo '{"skill_metrics":{"f1":0,"precision":0,"recall":0},"bundle_metrics":{"f1":0},"skipped":"ground-truth not in repo"}' > eval-result.json
            echo "SKIP: ground-truth data not available in CI"
          fi

      - name: Check F1 threshold
        run: |
          python -c "
          import json, sys
          r = json.load(open('eval-result.json'))
          if 'skipped' in r:
              print('SKIP: ' + r['skipped'])
              sys.exit(0)
          f1 = r['skill_metrics']['f1']
          p = r['skill_metrics']['precision']
          recall = r['skill_metrics']['recall']
          bf1 = r['bundle_metrics']['f1']
          print(f'Skill  — Precision: {p:.4f}, Recall: {recall:.4f}, F1: {f1:.4f}')
          print(f'Bundle — F1: {bf1:.4f}')
          if f1 < 0.75:
              print(f'FAIL: Skill F1 {f1:.4f} < 0.75 threshold')
              sys.exit(1)
          print(f'PASS: Skill F1 {f1:.4f} >= 0.75 threshold')
          "
