name: Cost Baseline (weekly)

# Roadmap 260515 §5c.7 Phase D.2 — weekly auto-refresh of
# docs/architecture/cost-baselines.md via Langfuse Cloud aggregation.
#
# Pre-req (one-time): repo secrets LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY.
# See docs/framework documentation/09_АДМИНИСТРИРОВАНИЕ/09.4.1_Langfuse.md#cost-baseline.

on:
  schedule:
    - cron: '0 9 * * 0'  # Sundays 09:00 UTC
  workflow_dispatch: {}  # allow manual trigger from Actions UI

jobs:
  baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install project + langfuse extras
        run: uv pip install --system -e ".[dev,langfuse]"

      - name: Run cost baseline extractor (default window = today-7..today-1)
        env:
          OBSERVABILITY__LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          OBSERVABILITY__LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          OBSERVABILITY__LANGFUSE_ENABLED: 'true'
        run: python scripts/analyze_langfuse_cost.py

      - name: Open / update PR with refreshed baseline
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: weekly cost baseline refresh'
          title: 'chore: weekly cost baseline refresh'
          body: |
            Auto-generated by `.github/workflows/cost-baseline.yml`
            (roadmap [260515 §5c.7](../../docs/roadmap/260515_ROADMAP_LANGFUSE_COST_BASELINE.md)).

            Source: `scripts/analyze_langfuse_cost.py`, default window
            today-7..today-1 (closed, avoids 15-30s ingestion lag).

            Review the diff for cost drift signals — large delta on
            Top-N or daily run-rate warrants follow-up.
          branch: auto/cost-baseline-refresh
          add-paths: |
            docs/architecture/cost-baselines.md
          delete-branch: true
