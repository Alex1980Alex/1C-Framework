name: Trusted Git docs

# Bootstrap: install the accepted checker in the trusted base branch first.
# This workflow never checks out PR code. Push/force-push enforcement is OPEN.
on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  git-docs:
    name: Git docs trusted range
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up trusted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Manifest trusted base delivery
        shell: bash
        run: >-
          python -I -B scripts/git_docs_package.py build
          --source "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/git-docs.zip"
          --source-base "$(git rev-parse HEAD)"
      - name: Check PR objects using trusted code
        shell: bash
        run: >-
          python -I -B scripts/git_docs_ci.py
          --root "$GITHUB_WORKSPACE"
          --event-name "$GITHUB_EVENT_NAME"
          --event-file "$GITHUB_EVENT_PATH"
          --trusted-manifest "$RUNNER_TEMP/git-docs.zip.manifest.json"
          --fetch-pr
