name: OpenSpec

on:
  pull_request:
    paths:
      - 'openspec/**'
      - 'ИБTransportManagementDevelop/Конфигурация/src/**'
      - '.github/workflows/openspec.yml'
  push:
    branches: [master, dev-master]
    paths:
      - 'openspec/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  openspec-lint:
    name: OpenSpec lint (validate + critique gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyyaml

      - name: Validate active changes (structural)
        id: validate
        run: |
          python scripts/openspec_lint_ci.py --mode structural --fail-on-error

      - name: Check change↔code coverage (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/openspec_lint_ci.py \
              --mode coverage \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --warn-only

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'openspec-lint-report.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
