# kb-lint configuration for PDF Vector & Graph Framework
# Docs: https://pypi.org/project/kb-lint/

[tool.kb-lint]
required_frontmatter = ["unified_id", "status", "tags", "confidence"]
recommended_frontmatter = ["related", "created_at", "updated_at", "promoted_from"]
min_article_words = 50
ignore_patterns = [
    "_templates/**",
    "templates/**",
    ".git/**",
    "node_modules/**",
    ".claude/**",
    "src/**",
    "tests/**",
    "tools/**",
    "scripts/**",
    "features/**",
    "data/**",
    "build/**",
    "tmp/**",
]
checks = ["links", "frontmatter", "orphans", "structure", "consistency"]
severity_threshold = "warning"
recognized_directories = ["patterns", "drafts", "assets"]
allowed_confidence_levels = ["high", "medium", "low"]
