# Pre-commit hooks configuration
# See https://pre-commit.com for more information

# Top-level exclude — applies to ALL hooks.
# - tools/                vendored / third-party tooling (serena, auto-documenter,
#                         mcp-reasoner, 1c-docs-rag etc). Most have own pyproject/
#                         lint configs that conflict with ours; some contain
#                         intentionally invalid Python (mock data, broken examples).
# - infra/                vendored npm/TS workspaces (task-master) + pipeline
#                         orchestrator with own conventions (E741 ambiguous names
#                         in legacy code).
# - external/             git submodules / vendored 3rd-party repos (1c_mcp etc).
# - cache/                runtime artifacts (active-todos.json, etc).
# - src/bsl/              1С Enterprise generated BSL/XML files (CRLF/whitespace
#                         is platform-controlled, not pre-commit business).
# - jre/                  bundled JDK distribution for EDT (legal/, lib/, conf/).
# - .serena/              IDE extension state.
# - .vscode-extensions/   bundled VS Code extension payloads.
# - *.log / mcp-server.log* / setup / VerInfo.txt / ReadMe.txt /
#   data/analyze-1c-research/  generated artifacts (no point fixing trailing
#                         whitespace in machine-output).
# - docs/documentation/   imported third-party documentation (LangChain/MCP/
#                         Claude Code translated docs) — whitespace preserved
#                         deliberately for parity with upstream.
# - .obsidian/            Obsidian app-managed vault config (rewritten by the app
#                         without trailing newline → perpetual eof-fixer churn).
# - .claude/**/cache/     generated knowledge/skill caches (_index.json etc) —
#                         tool-written, not hand-edited.
# - EDT-воркспейсы 1С (TransportManagementDevelop_KAT/, _SVETLY/,
#   ИБTransportManagementDevelop/, MFM/, configuration/) — тот же класс, что
#   src/bsl/: BSL/XML/HTML выгружает платформа, whitespace и EOL контролирует она.
#   KAT лежит в ГЛАВНОМ репо (не сабмодуль) → без этого исключения хуки правили
#   2610 продуктовых файлов конфигурации и job «Pre-commit Hooks» был красным.
exclude: |
  (?x)^(
    tools/.*|
    infra/.*|
    external/.*|
    cache/.*|
    src/bsl/.*|
    jre/.*|
    \.serena/.*|
    \.vscode-extensions/.*|
    .*\.log(\..*)?|
    mcp-server\.log.*|
    setup|
    VerInfo\.txt|
    ReadMe\.txt|
    data/analyze-1c-research/.*|
    docs/documentation/.*|
    tmp/.*|
    \.obsidian/.*|
    \.claude/.*/cache/.*|
  )$

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        # Machine-generated / auto-rewritten files lack a trailing newline and are
        # re-written without one on every auto-commit → perpetual CI churn. Exclude
        # from whitespace/eof hooks only; gitleaks + check-json still scan them.
        # - .claude/settings*.json   rewritten by auto-save hook
        # - pipeline/                pipeline_state.py state JSON + scratch artifacts
        # - docs/wiki/log.md, drafts auto-appended by wiki hooks
        # - .mcp.json.example        generated mirror of .mcp.json
        # - EDT-воркспейсы 1С        выгрузка платформы (её whitespace/EOL), тот же
        #   класс, что src/bsl/; KAT лежит в ГЛАВНОМ репо, поэтому без исключения
        #   хуки правили 2610 продуктовых файлов и job был красным. Держим здесь,
        #   а не в top-level exclude, чтобы gitleaks/check-json их всё же сканировали.
        exclude: |
          (?x)^(
            \.claude/settings(\.local)?\.json|
            pipeline/.*|
            docs/wiki/log\.md|
            docs/wiki/drafts/.*|
            \.mcp\.json\.example|
            TransportManagementDevelop_KAT/.*|
            TransportManagementDevelop_SVETLY/.*|
            ИБTransportManagementDevelop/.*|
            MFM/.*|
            configuration/.*
          )$
      - id: end-of-file-fixer
        name: Fix End of Files
        # Зеркало exclude из trailing-whitespace (см. обоснование там же).
        exclude: |
          (?x)^(
            \.claude/settings(\.local)?\.json|
            pipeline/.*|
            docs/wiki/log\.md|
            docs/wiki/drafts/.*|
            \.mcp\.json\.example|
            TransportManagementDevelop_KAT/.*|
            TransportManagementDevelop_SVETLY/.*|
            ИБTransportManagementDevelop/.*|
            MFM/.*|
            configuration/.*
          )$
      - id: check-yaml
        name: Check YAML
        args: ['--unsafe']
      - id: check-json
        name: Check JSON
      - id: check-toml
        name: Check TOML
      - id: check-added-large-files
        name: Check for Large Files
        args: ['--maxkb=1000']
      - id: no-commit-to-branch
        name: No Direct Commits to Main
        args: ['--branch', 'main']

  # markdownlint-cli2 — markdown validation, wiki-scoped (restored 2026-07-05,
  # audit 260705 P0.1: the wiring documented in ch. 32.8 was missing — wiki was
  # not gated on commit at all). entities/ excluded: 2800+ auto-generated
  # LightRAG pages are data, not curated content (mirrors .kblintrc.yml).
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        name: Markdown Lint (wiki)
        files: ^docs/wiki/.*\.md$
        exclude: ^docs/wiki/(entities/|log\.md)

  # kb-lint — wiki frontmatter/structure validation (restored 2026-07-05, same
  # P0.1). Wrapper defaults to `--ci docs/wiki` (bare --ci would lint from repo
  # root!) and carries UTF-8 stdout + Cyrillic-rename + .gitignore-encoding
  # safety patches. Draft writers emit `status: draft` since the same fix.
  - repo: local
    hooks:
      - id: kb-lint
        name: KB Lint (wiki)
        entry: python scripts/kb_lint_ci.py
        language: system
        files: ^docs/wiki/.*\.md$
        pass_filenames: false

  # gitleaks — secret scanning (added 2026-05-10 after HF + OpenRouter leak
  # via .claude/settings.local.json). Blocks commits that introduce known
  # secret patterns (HF/OpenAI/Anthropic/AWS/GCP/Slack/GitHub PAT/private keys).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Gitleaks (secret scan)

  # Ruff - Python linter and formatter
  # v0.8.0 was the original pin but it diverges from local dev ruff (0.15+):
  # 741 false-positive errors on src/ (UP005/006/007 transitions etc) that
  # newer ruff handles correctly. Bumped to v0.15.0 to align with `ruff>=0.15`
  # in pyproject dev deps.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        name: Ruff Lint
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff Format

  # mypy disabled in pre-commit — duplicates CI's standalone `typecheck` job
  # (.github/workflows/ci.yml::typecheck has `continue-on-error: true`) и
  # требует baseline filter wrapper для work с pre-existing tech debt
  # (1616 ошибок в 247 файлах в strict mode, не относятся к scope этой ветки).
  # См. roadmap 260514 для plan'а введения mypy-baseline.txt ratchet gate.
  # Локальный type check: `mypy src/` (или CI job по push в PR).

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [kb-lint]  # language:system не поддерживается pre-commit.ci; локальный гейт
  submodules: false
