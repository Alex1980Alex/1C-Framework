# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
      - id: end-of-file-fixer
        name: Fix End of Files
      - id: check-yaml
        name: Check YAML
        args: ['--unsafe']
      - id: check-json
        name: Check JSON
      - id: check-toml
        name: Check TOML
      - id: check-added-large-files
        name: Check for Large Files
        args: ['--maxkb=1000']
      - id: no-commit-to-branch
        name: No Direct Commits to Main
        args: ['--branch', 'main']

  # gitleaks — secret scanning (added 2026-05-10 after HF + OpenRouter leak
  # via .claude/settings.local.json). Blocks commits that introduce known
  # secret patterns (HF/OpenAI/Anthropic/AWS/GCP/Slack/GitHub PAT/private keys).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Gitleaks (secret scan)

  # Ruff - Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        name: Ruff Lint
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff Format

  # mypy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: Type Check (mypy)
        additional_dependencies:
          - pydantic>=2.10
          - fastapi>=0.115
          - types-requests
        args: [--ignore-missing-imports, --warn-return-any]
        # Tests/docs/scripts excluded by convention.
        # src/pdf_framework/quick.py + src/api/auth/ temporarily excluded —
        # 421 pre-existing errors in 96 files were blocking ALL structured
        # commits via this hook (forcing --no-verify bypass for unrelated
        # changes, e.g. sandbox skeleton commits 9b392c465 + 11a1d1852 on
        # 2026-05-14). Cleanup tracked in
        # docs/roadmap/260514_ROADMAP_MYPY_CLEANUP.md — un-exclude as
        # individual files are fixed. Do NOT widen this exclude further
        # without adding a roadmap entry.
        exclude: ^(tests/|docs/|scripts/|src/pdf_framework/quick\.py$|src/api/auth/)

  # markdownlint-cli2 — Phase 3 Auto-Librarian wiki format check
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.0
    hooks:
      - id: markdownlint-cli2
        name: Markdown Lint (wiki)
        files: ^docs/wiki/.*\.md$

  # kb-lint — Phase 3 Auto-Librarian wiki KB validation
  - repo: local
    hooks:
      - id: kb-lint
        name: KB Lint (wiki)
        entry: python scripts/kb_lint_ci.py
        language: system
        files: ^docs/wiki/.*\.md$
        pass_filenames: false

  # hermes-eval-smoke — Phase 2.1 DSPy migration regression gate
  - repo: local
    hooks:
      - id: hermes-eval-smoke
        name: Hermes Eval Smoke
        entry: python scripts/eval_hermes_phase2.py --smoke
        language: system
        files: ^src/pdf_framework/(agents/rag/nodes|prompts/signatures)\.py$
        pass_filenames: false

  # mcp-smoke-check — roadmap §4.7: structural validation .mcp.json servers
  - repo: local
    hooks:
      - id: mcp-smoke-check
        name: MCP Servers Smoke Check
        entry: python scripts/mcp_smoke_check.py
        language: system
        files: ^\.mcp\.json$
        pass_filenames: false

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
