# Neo4j Community Edition for BSL GraphRAG (Phase 3 of roadmap 260502)
# Usage:
#   docker compose -f docker/docker-compose.neo4j.yml up -d
#   Browser: http://localhost:7474 (login neo4j / bsl-graph-2026)
#   Bolt:    localhost:7687

services:
  neo4j:
    image: neo4j:5-community
    container_name: bsl-graph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/bsl-graph-2026
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_default__listen__address: 0.0.0.0
    volumes:
      - bsl-graph-neo4j-data:/data
      - bsl-graph-neo4j-logs:/logs
      - bsl-graph-neo4j-import:/var/lib/neo4j/import
      - bsl-graph-neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  bsl-graph-neo4j-data:
  bsl-graph-neo4j-logs:
  bsl-graph-neo4j-import:
  bsl-graph-neo4j-plugins: