# Docker Compose for PDF Vector & Graph Framework (Phase 52)
# Production-ready containerization with hardening

version: '3.8'

services:
  # Main API application
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pdf-rag-api
    ports:
      - "8000:8000"
      - "7860:7860"  # Gradio UI
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/pdf_rag
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VECTOR_STORE__PROVIDER=qdrant
      - VECTOR_STORE__QDRANT_URL=http://qdrant:6333
      - GRAPH_STORE__PROVIDER=${GRAPH_STORE__PROVIDER:-networkx}
      - GRAPH_STORE__NEO4J_URI=bolt://neo4j:7687
      - GRAPH_STORE__NEO4J_USER=${NEO4J_USER:-neo4j}
      - GRAPH_STORE__NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - QUEUE__ENABLED=${QUEUE__ENABLED:-true}
      - QUEUE__REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 1g
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - pdf-rag-network

  # Phase 59: ARQ Worker for async task processing
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pdf-rag-worker
    command: python -m src.workers.worker
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/pdf_rag
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VECTOR_STORE__PROVIDER=qdrant
      - VECTOR_STORE__QDRANT_URL=http://qdrant:6333
      - GRAPH_STORE__PROVIDER=${GRAPH_STORE__PROVIDER:-networkx}
      - GRAPH_STORE__NEO4J_URI=bolt://neo4j:7687
      - GRAPH_STORE__NEO4J_USER=${NEO4J_USER:-neo4j}
      - GRAPH_STORE__NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - QUEUE__ENABLED=true
      - QUEUE__REDIS_URL=redis://redis:6379/0
      - QUEUE__MAX_JOBS=${QUEUE__MAX_JOBS:-100}
      - QUEUE__TIMEOUT=${QUEUE__TIMEOUT:-3600}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'from arq import create_pool; import asyncio; asyncio.run((lambda: create_pool(\"redis://redis:6379/0\"))().ping())' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    networks:
      - pdf-rag-network

  # PostgreSQL with pgvector (Phase 23.2)
  db:
    image: pgvector/pgvector:pg16
    container_name: pdf-rag-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=pdf_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    networks:
      - pdf-rag-network

  # Qdrant Vector Store (Phase 23.1)
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: pdf-rag-qdrant
    ports:
      - "6333:6333"  # API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    networks:
      - pdf-rag-network

  # Redis for caching and rate limiting (Phase 23.3)
  redis:
    image: redis:7-alpine
    container_name: pdf-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pdf-rag-network

  # Neo4j Graph Database (Phase 51)
  neo4j:
    image: neo4j:5-community
    container_name: pdf-rag-neo4j
    ports:
      - "17474:7474"  # Browser (offset to avoid conflict with 1c-neo4j)
      - "17687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    networks:
      - pdf-rag-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: pdf-rag-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - pdf-rag-network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: pdf-rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - pdf-rag-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: pdf-rag-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - pdf-rag-network

  # TimescaleDB for AI Memory (Phase 44/49: Migration from 1C-Enterprise_Framework)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: pdf-rag-timescaledb
    ports:
      - "5433:5432"  # Different port to avoid conflict with pgvector
    environment:
      POSTGRES_DB: ai_memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-memory_pass}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d ai_memory"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    networks:
      - pdf-rag-network
    profiles:
      - memory  # Activate: docker compose --profile memory up

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  prometheus_data:
  grafana_data:
  timescaledb_data:

networks:
  pdf-rag-network:
    driver: bridge
