# Лёгкий OTLP-приёмник нативной телеметрии Claude Code.
# ADR-022 P2 — базовый sink (debug-exporter, верификация эмиссии в `docker logs`).
# 260718 H-P1 — РАСШИРЕНО: file-exporter'ы пишут сырец в data/otel/ (bind-mount) для
#   cross-check (H-P3): native `claude_code.tool_result` (success/duration_ms/error_type)
#   vs hook unpaired-Pre. Добавление аддитивно — debug-ветка ADR-022 цела.
# H-P2 (Langfuse) добавит exporter otlphttp → /api/public/otel отдельным overlay-конфигом.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # ADR-022 P2: человекочитаемый sink — проверить, что эмиссия летит (docker logs).
  debug:
    verbosity: detailed
  # 260718 H-P1: машиночитаемый сырец логов (события claude_code.tool_result —
  # плоские tool_name/tool_use_id/success/duration_ms/error_type = чистейший сигнал
  # для cross-check). Отдельный файл на сигнал → парсер H-P3 не разбирает смесь.
  file/logs:
    path: /var/otel/claude-otel-logs.jsonl
    rotation:
      max_megabytes: 20
      max_backups: 5
  # Спаны claude_code.tool.execution (success/duration_ms) + дерево делегирования.
  file/traces:
    path: /var/otel/claude-otel-traces.jsonl
    rotation:
      max_megabytes: 20
      max_backups: 5

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/logs]
