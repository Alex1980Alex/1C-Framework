# Prometheus configuration for PDF Vector & Graph Framework
# F3.4.4: Scrapes API metrics every 15 seconds

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'pdf-framework'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # API metrics endpoint
  - job_name: 'pdf-framework-api'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'pdf-api'
          component: 'backend'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Qdrant metrics (if available)
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          service: 'qdrant'
          component: 'vector-store'
    metrics_path: '/metrics'

  # PostgreSQL exporter (if available)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis exporter (if available)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
