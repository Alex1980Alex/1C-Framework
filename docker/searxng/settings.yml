# Минимальные настройки SearXNG для программного доступа (ADR-040 Фаза 1).
# use_default_settings: мерж с дефолтами образа (движки и пр.).
use_default_settings: true

server:
  secret_key: "onec-search-local-dev-0a1b2c3d4e5f"
  # limiter=false: бот-ограничитель блокирует НАШ JSON-API → выключаем (сервис локальный).
  limiter: false
  image_proxy: false

search:
  # ВКЛючаем JSON-формат (по умолчанию только html) — иначе ?format=json → 403.
  formats:
    - html
    - json
  default_lang: "ru-RU"
