# kb-lint configuration for PDF Vector & Graph Framework wiki
# Docs: https://pypi.org/project/kb-lint/
#
# Note: kb-lint reads this file from <wiki_path>/.kblintrc.yml (not project root
# .kb-lint.toml — that file is unused as of kb-lint 0.1.1; see config.py:60).

required_frontmatter:
  - unified_id
  - status
  - tags
  - confidence
recommended_frontmatter:
  - related
  - created_at
  - updated_at
  - promoted_from
min_article_words: 50
ignore_patterns:
  - "_templates/**"
  - "templates/**"
  - ".git/**"
  - "node_modules/**"
  - ".claude/**"
  - "src/**"
  - "tests/**"
  - "tools/**"
  - "scripts/**"
  - "features/**"
  - "data/**"
  - "build/**"
  - "tmp/**"
checks:
  - links
  - frontmatter
  - orphans
  - structure
  - consistency
severity_threshold: warning
recognized_directories:
  - patterns
  - drafts
  - assets
allowed_confidence_levels:
  - high
  - medium
  - low
