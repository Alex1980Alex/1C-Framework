[pytest]
# Pytest configuration for development-pipeline

# Test paths
testpaths = tests

# Python path configuration - add current directory to path
pythonpath = .

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
