# OpenSpec Project Configuration — 1С-Framework
# Адаптация SDD для разработки на 1С:Предприятие

project:
  name: "1С-Framework"
  description: "Фреймворк для 1С-разработки с AI (Claude Code + MCP)"
  language: "ru"

tech_stack:
  platform: "1С:Предприятие 8.3.27"
  code_language: "BSL (Built-in Scripting Language)"
  config_format: "XML (Designer export)"
  ide: "Claude Code CLI + EDT"
  mcp_servers:
    - "1c-mcp-crud (данные, метаданные, запросы)"
    - "bsl-semantic-search (поиск по коду)"
    - "bsl-platform-context (API платформы)"
    - "METR (сборка, тесты, синтаксис)"
    - "bsl-code-search (tree-sitter AST)"

rules:
  proposal:
    - "Описывать бизнес-процесс, а не техническую реализацию"
    - "Указывать номер задачи (GKSTCPLK-XXXX)"
    - "Явно указывать scope: что менять, что НЕ менять"
    - "Указывать ограничения: типовой код не менять, использовать расширения"

  specs:
    # Delta-spec формат (brownfield-first)
    - "КАЖДЫЙ requirement ОБЯЗАН начинаться с маркера: ## ADDED или ## MODIFIED"
    - "ADDED — новый объект/реквизит/табличная часть, которых нет в конфигурации"
    - "MODIFIED — изменение существующего: добавление условия, доработка запроса, расширение логики"
    - "Перед выбором маркера — проверить объект через get_metadata (1c-mcp-crud)"
    - "НЕ описывать существующие объекты полностью — только дельту изменений"
    - "Для MODIFIED указывать: что именно меняется, было/стало, какой модуль затронут"
    # Содержание specs
    - "Для каждого объекта метаданных указать: тип, имя, синоним, реквизиты с типами данных"
    - "Для регистров: измерения, ресурсы, реквизиты с точными типами"
    - "Для табличных частей: все колонки с типами"
    - "Проверять имена полей через get_metadata (1c-mcp-crud)"
    - "Использовать префикс гкс_ для кастомных объектов"
    - "Указывать Given/When/Then для сценариев"
    - "Обозначать граничные условия и поведение при пустых полях"

  design:
    - "Указывать какие модули будут изменены (модуль объекта, менеджера, формы, общий модуль)"
    - "Для каждого модуля: процедуры/функции с сигнатурами"
    - "Искать аналогичные реализации через bsl-semantic-search"
    - "Использовать существующие функции конфигурации, НЕ дублировать"
    - "SQL-запросы с проверенными именами полей"
    - "Указывать зависимости между модулями"
    - "MODIFIED объекты: указать конкретную процедуру/запрос и место изменения (строку/блок)"
    - "ADDED объекты: полная архитектура нового кода"

  tasks:
    - "Атомарные шаги для implement-1c-task"
    - "Каждый шаг: файл, место вставки, код"
    - "Порядок выполнения с зависимостями"
    - "Комментарии с номером задачи: // GKSTCPLK-XXXX"

delta_specs:
  markers:
    ADDED: "Новый объект/реквизит/логика — не существует в текущей конфигурации"
    MODIFIED: "Изменение существующего объекта — доработка запроса, добавление условия, расширение"
  verification:
    - "Перед маркировкой: get_metadata для проверки существования объекта"
    - "Перед маркировкой: bsl_search/bsl_hybrid_search для поиска связанного кода"
    - "ADDED + существующий объект = ОШИБКА (должен быть MODIFIED)"
    - "MODIFIED без указания 'что именно меняется' = ОШИБКА"
  format:
    added: |
      ## ADDED Requirements
      ### Requirement: <название>
      <RFC 2119: MUST/SHOULD/MAY>
      #### Объекты метаданных (новые)
      | Объект | Тип | Роль |
      #### Scenarios (Given/When/Then)
    modified: |
      ## MODIFIED Requirements
      ### Requirement: <название>
      **Объект:** <полный путь: Документ.гкс_Xxx>
      **Модуль:** <модуль объекта / менеджера / формы>
      **Что меняется:** <конкретная процедура/запрос/условие>
      **Было:** <текущее поведение>
      **Стало:** <новое поведение, RFC 2119>
      #### Scenarios (Given/When/Then)
  anti_patterns:
    - "НЕ переписывать весь модуль — только дельту"
    - "НЕ создавать новый объект если аналог уже есть в конфигурации"
    - "НЕ дублировать типовую логику БСП/ERP — ссылаться на существующие процедуры"

conventions:
  naming:
    procedures: "CamelCase (ОбработкаПроведения, ПриСозданииНаСервере)"
    variables: "camelCase (текущаяДата, номерДокумента)"
    metadata_prefix: "гкс_"
  formatting:
    indent: "tab"
    max_line_length: 120
    language: "Russian (1С BSL)"
