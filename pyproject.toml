[project]
name = "pdf-vector-graph-framework"
version = "1.5.0"
description = "Framework for intelligent PDF document processing with Vector and Graph databases"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # === LangChain Ecosystem ===
    "langchain>=0.3",
    "langgraph>=0.3",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-community",
    "langchain-text-splitters",

    # === PDF Processing ===
    "pymupdf>=1.24",
    "pdfplumber>=0.11",

    # === Vector Stores ===
    "chromadb>=0.5",          # opt-in provider via VECTOR_STORE__PROVIDER=chroma (src/pdf_framework/vector_store/providers/chroma.py)

    # === Embeddings ===
    "sentence-transformers>=3.0",
    # ColPali visual retrieval (Phase 55)
    "colpali-engine>=0.1.0",
    "transformers[torch]>=4.40.0",
    "pillow>=10.0",
    # BGE-M3 unified model (Phase 56)
    "FlagEmbedding>=1.2.0",

    # === Graph ===
    "networkx>=3.4",

    # === HTTP / Auth ===
    "httpx>=0.27",          # TEI embedder client + BSL MCP HTTP transport (5 src files)
    "pyjwt>=2.8",           # JWT auth (src/api/auth/jwt_handler.py) — core, AUTH__ENABLED=true default

    # === API ===
    "fastapi>=0.115",
    "uvicorn>=0.32",

    # === MCP Server ===
    "mcp>=1.0",

    # === Utilities ===
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "rich>=13.0",
    "typer>=0.15",
    "prometheus-client>=0.21",
    # tenacity is also a transitive dep through langchain, declared here explicitly
    # because src/pdf_framework/utils/retry.py imports it directly (roadmap 260509 §3.7)
    "tenacity>=8.0",
]

[project.optional-dependencies]
# FAISS (requires C++ build tools)
faiss = ["faiss-cpu>=1.8"]
# Extended vector stores
qdrant = ["qdrant-client>=1.12"]
# Extended graph stores
neo4j = ["neo4j>=5.25"]
# Extended PDF processing
unstructured = ["unstructured[pdf]>=0.16"]
# Phase 15.1: Docling (IBM) - layout-aware PDF parsing with OCR
docling = [
    "docling>=2.70.0",
    "langchain-docling>=0.3.0",
    "pymupdf4llm>=0.2.9",
]
# Extended embeddings
voyage = ["voyageai>=0.3"]
# Russian morphology (BM25 lemmatization)
morphology = ["pymorphy3>=2.0"]
# Phase 3.9: DeepEval CI gating (faithfulness, hallucination metrics)
# Heavy deps (pulls torch, sentence-transformers); install via pip install -e ".[eval]"
eval = ["deepeval>=0.20"]
# NER (heavy dependency)
nlp = ["spacy>=3.8"]
# Deep Agents
deep = ["deepagents>=0.1"]
# LangSmith observability + sandbox (Hermes Ф5)
langsmith = ["langsmith[sandbox]>=0.3"]
# Langfuse observability
langfuse = ["langfuse>=4.0,<5.0"]
# Hermes Ф5 Sandbox — E2B Code Interpreter (stateful Jupyter in Firecracker microVM)
sandbox-e2b = ["e2b-code-interpreter>=1.2.0"]
# ИТС deep-fetch (scripts/its_fetch.py): авторизованный fetch its.1c.ru + извлечение контента (skill its-research)
its = ["playwright>=1.40", "trafilatura>=2.0"]
# All optional dependencies
all = [
    "pdf-vector-graph-framework[faiss,qdrant,neo4j,unstructured,docling,voyage,nlp,deep,langsmith,langfuse,queue,bsl,memory,llm-rotation,sandbox-e2b]",
]
# Phase 59: Async Processing Queue (ARQ + Redis) — optional extra; install with pip install -e ".[queue]" for async indexing
queue = ["arq>=0.26"]
# === BSL Development (Phase 44: Migration from 1C-Enterprise_Framework) ===
# Phase 8 retrieval (Qwen3 4096d via TEI) использует httpx (base dep) + qdrant-client.
# Late Chunking pooling — sentence-transformers (base). Дополнительный flash-attn опционален
# через transformers extras; для production retrieval не требуется.
bsl = [
    "qdrant-client>=1.12",
    "neo4j>=5.25",
    "fastmcp>=0.1",
    "nomic[local]>=3.0",   # legacy fallback (до Phase 9.1 был активным embedder); сохранён для backward-compat скриптов
]
# Phase 9.1: memory hooks aligned to Qwen3 4096d via TEI. TEI client = httpx (base dep).
memory = [
    "qdrant-client>=1.12",
    "google-generativeai>=0.8",
]
llm-rotation = [
    "mistralai>=1.0",
    "openai>=1.0",
    "google-generativeai>=0.8",
    # claude-agent-sdk: official Anthropic Python package for Claude Code CLI
    # subprocess management. Replaces raw asyncio.create_subprocess_exec in
    # _make_request_claude_cli (roadmap 260516 Phase 1). Subscription-based
    # auth via OAuth; flat-rate cost. Required for working max_turns=1 +
    # typed messages (AssistantMessage/ResultMessage).
    "claude-agent-sdk>=0.2,<0.3",
]
all-bsl = [
    "pdf-vector-graph-framework[bsl,memory,llm-rotation]",
]
# Development
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # `aiosqlite` required by tests/test_conversational/, tests/test_multitenancy/,
    # tests/integration/test_proposition.py etc. — async SQLite backend for
    # session-state + multitenancy tests. Was missing → CI Tests failed with
    # ModuleNotFoundError on ~30 test files.
    "aiosqlite>=0.20",
    "ruff>=0.15",
    "mypy>=1.13",
    "mypy-baseline>=0.7.4",
    "interrogate>=1.7",
    # Phase 3 Auto-Librarian — wiki KB linting
    "kb-lint>=0.1",
]

[project.scripts]
pdf-framework = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# RUF100 (unused-noqa) + PGH004 (blanket-noqa) — noqa hygiene: prevent a `# noqa`
# or `# noqa: F821` from masking a deleted/renamed symbol (root cause of the
# 2026-06 merge/autofix regression). See docs/roadmap §regression-hardening.
select = ["E", "F", "I", "N", "W", "UP", "RUF100", "PGH004"]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "E402",   # module-import-not-at-top — conditional imports
    "E722",   # bare-except — legacy code
    "N806",   # non-lowercase-variable-in-function — 1C naming
    "N817",   # camelcase-imported-as-acronym
    "UP042",  # replace-str-enum — requires StrEnum (3.11+)
]

[tool.ruff.lint.per-file-ignores]
# Tests: fixture-only imports, unused vars в test scaffolding, debug f-strings
# и placeholder tests с TODO-ассертами — стандартный шум test-кода
"tests/**" = [
    "F401",  # unused imports (pytest fixtures, mocking setup)
    "F541",  # f-string without placeholders (debug output)
    "F821",  # undefined name (placeholder/TODO tests)
    "F841",  # unused local variable (intermediate assertions)
    "E741",  # ambiguous variable (test data l/I/O is fine)
]
# Claude Code hooks + tests: graceful fallback imports, lazy-loaded modules,
# intentionally short-aliased deps (`_DT = datetime`, `_P = Path`)
# для compact hook-кода
".claude/**" = [
    "F401",  # graceful import fallbacks (try/except import patterns)
    "F541",  # debug f-strings в логировании
    "F841",  # logged exception variables / intermediate assertions
    "E741",  # ambiguous variable (l/I/O — short loop vars в hot path'ах)
    "N812",  # lowercase import as non-lowercase alias (`_DT = datetime`)
    "N814",  # camelcase import as constant alias (`_P = Path`)
]
# Scripts: utilities, ad-hoc tooling, exploratory code
"scripts/**" = [
    "F401",  # placeholder/exploratory imports
    "F541",  # f-string templates без переменных
    "F841",  # debug-only assignments
    "E741",  # ambiguous variable name (script loop vars)
    "N805",  # script-style funcs that look like methods
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `--import-mode=importlib` — modern pytest discovery that does NOT require
# every test directory to have `__init__.py`. Without it pytest builds module
# names from the rootdir + `__init__.py` chain, which on this repo causes:
#   1. `tests/bsl/test_parser.py` → name `bsl.test_parser` → collides with
#      `src/bsl/` package (no `bsl.test_parser` submodule exists there).
#   2. `tests/unit/agents/test_plan_execute.py` collides with
#      `tests/integration/test_plan_execute.py` (same basename, different dirs,
#      both end up as bare `test_plan_execute` → second one fails to collect).
#   3. Same collision for `test_neo4j.py` between unit/graph_store/ and integration/.
# `importlib` mode skips sys.modules registration and treats each test file
# by full path, eliminating all three collisions in one knob.
addopts = "--import-mode=importlib"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require external services)",
    "e2e: marks tests as end-to-end tests (require full stack)",
    "unit: marks tests as unit tests (fast, isolated)",
    "phase4: Phase 4 (skill router / semantic skill indexer)",
    "phase8: Phase 8 (Qwen3 retrieval, TEI, late chunking, OOM)",
    "phase9: Phase 9 (memory hooks alignment, framework_search)",
    "phase14: Phase 14 suite",
    "phase15: Phase 15 suite",
    "phase16: Phase 16 suite",
    "phase17: Phase 17 suite",
    "phase18: Phase 18 suite",
    "phase19: Phase 19 suite",
    "phase20: Phase 20 suite",
    "phase21: Phase 21 suite",
    "phase22: Phase 22 suite",
    "phase23: Phase 23 suite",
    "framework_search: framework_search self-index subsystem",
    "bsl: BSL semantic search / refactoring / debugger tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/*/__init__.py",
    "tests/*",
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.11"
strict = true

# Сторонние библиотеки без type stubs / py.typed marker — ignore_missing_imports
# (root-cause fix вместо baseline-masking; §21.4, verified 2026-05-29).
# ВАЖНО: внутренние модули (pdf_framework.*, shared.*) сюда НЕ входят — их
# import-not-found = реальные баги (mypy-path/namespace), фиксятся в срезах.
[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "colpali_engine.*",
    "datasets.*",
    "docling.*",
    "docling_parse.*",
    "dspy.*",
    "e2b_code_interpreter.*",
    "fitz", "fitz.*",
    "FlagEmbedding.*",
    "gradio.*",
    "graspologic.*",
    "langgraph.checkpoint.sqlite",
    "multilspy.*",
    "networkx", "networkx.*",
    "pandas", "pandas.*",
    "plotly", "plotly.*",
    "pymorphy3", "pymorphy3.*",
    "pymupdf4llm", "pymupdf4llm.*",
    "ragatouille.*",
    "serpapi", "serpapi.*",
    "sklearn.*",
    "streamlit", "streamlit.*",
    "tavily", "tavily.*",
    "tqdm", "tqdm.*",
    "trl", "trl.*",
    "unsloth", "unsloth.*",
    "unstructured.*",
    "watchdog.*",
    "yaml", "yaml.*",
]
ignore_missing_imports = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
fail-under = 60
exclude = ["tests", "docs", "scripts", "data"]
verbose = 1
