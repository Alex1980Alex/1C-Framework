[project]
name = "pdf-vector-graph-framework"
version = "1.5.0"
description = "Framework for intelligent PDF document processing with Vector and Graph databases"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # === LangChain Ecosystem ===
    "langchain>=0.3",
    "langgraph>=0.3",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-community",
    "langchain-text-splitters",

    # === PDF Processing ===
    "pymupdf>=1.24",
    "pdfplumber>=0.11",

    # === Vector Stores ===
    "chromadb>=0.5",

    # === Embeddings ===
    "sentence-transformers>=3.0",
    # ColPali visual retrieval (Phase 55)
    "colpali-engine>=0.1.0",
    "transformers[torch]>=4.40.0",
    "pillow>=10.0",
    # BGE-M3 unified model (Phase 56)
    "FlagEmbedding>=1.2.0",

    # === Graph ===
    "networkx>=3.4",

    # === API ===
    "fastapi>=0.115",
    "uvicorn>=0.32",

    # === MCP Server ===
    "mcp>=1.0",

    # === Utilities ===
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "rich>=13.0",
    "typer>=0.15",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
# FAISS (requires C++ build tools)
faiss = ["faiss-cpu>=1.8"]
# Extended vector stores
qdrant = ["qdrant-client>=1.12"]
# Extended graph stores
neo4j = ["neo4j>=5.25"]
# Extended PDF processing
unstructured = ["unstructured[pdf]>=0.16"]
# Phase 15.1: Docling (IBM) - layout-aware PDF parsing with OCR
docling = [
    "docling>=2.70.0",
    "langchain-docling>=0.3.0",
    "pymupdf4llm>=0.2.9",
]
# Extended embeddings
voyage = ["voyageai>=0.3"]
# Russian morphology (BM25 lemmatization)
morphology = ["pymorphy3>=2.0"]
# NER (heavy dependency)
nlp = ["spacy>=3.8"]
# Deep Agents
deep = ["deepagents>=0.1"]
# LangSmith observability
langsmith = ["langsmith>=0.2"]
# Langfuse observability
langfuse = ["langfuse>=2.0"]
# All optional dependencies
all = [
    "pdf-vector-graph-framework[faiss,qdrant,neo4j,unstructured,docling,voyage,nlp,deep,langsmith,langfuse,queue]",
]
# Phase 59: Async Processing Queue (ARQ + Redis)
queue = ["arq>=0.26"]
# Development
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "interrogate>=1.7",
]

[project.scripts]
pdf-framework = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require external services)",
    "e2e: marks tests as end-to-end tests (require full stack)",
    "unit: marks tests as unit tests (fast, isolated)",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
fail-under = 60
exclude = ["tests", "docs", "scripts", "data"]
verbose = 1
