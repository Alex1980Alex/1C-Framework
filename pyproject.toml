[project]
name = "pdf-vector-graph-framework"
version = "0.1.0"
description = "Framework for intelligent PDF document processing with Vector and Graph databases"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # === LangChain Ecosystem ===
    "langchain>=0.3",
    "langgraph>=0.3",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-community",
    "langchain-text-splitters",

    # === PDF Processing ===
    "pymupdf>=1.24",
    "pdfplumber>=0.11",

    # === Vector Stores ===
    "chromadb>=0.5",

    # === Embeddings ===
    "sentence-transformers>=3.0",

    # === Graph ===
    "networkx>=3.4",

    # === API ===
    "fastapi>=0.115",
    "uvicorn>=0.32",

    # === MCP Server ===
    "mcp>=1.0",

    # === Utilities ===
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "rich>=13.0",
    "typer>=0.15",
]

[project.optional-dependencies]
# FAISS (requires C++ build tools)
faiss = ["faiss-cpu>=1.8"]
# Extended vector stores
qdrant = ["qdrant-client>=1.12"]
# Extended graph stores
neo4j = ["neo4j>=5.25"]
# Extended PDF processing
unstructured = ["unstructured[pdf]>=0.16"]
# Phase 15.1: Docling (IBM) - layout-aware PDF parsing with OCR
docling = [
    "docling>=2.70.0",
    "langchain-docling>=0.3.0",
    "pymupdf4llm>=0.2.9",
]
# Extended embeddings
voyage = ["voyageai>=0.3"]
# Russian morphology (BM25 lemmatization)
morphology = ["pymorphy3>=2.0"]
# NER (heavy dependency)
nlp = ["spacy>=3.8"]
# Deep Agents
deep = ["deepagents>=0.1"]
# LangSmith observability
langsmith = ["langsmith>=0.2"]
# All optional dependencies
all = [
    "pdf-vector-graph-framework[faiss,qdrant,neo4j,unstructured,docling,voyage,nlp,deep,langsmith]",
]
# Development
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
pdf-framework = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
