# SonarQube project configuration for 1C:Enterprise BSL analysis
# Docs: https://github.com/1c-syntax/sonar-bsl-plugin-community

sonar.projectKey=upravlenie-transportom-plk
sonar.projectName=УправлениеТранспортомНаПЛК
sonar.projectVersion=2026.1.1.0

# ADR-048 (2026-07-06): скоуп = живые конфигурации (ИБ+SVETLY+MFM, A7 вар.а); configuration/<JIRA>
# ИСКЛЮЧЁН целиком (ведение задач, не код; гейт ADR-037 их тоже не детектит). runner/CI
# открывают список ДИНАМИЧЕСКИ через scripts/sonar_sources.py (-Dsonar.sources=<comma-list>).
# Значение ниже — СТАТИЧЕСКИЙ FALLBACK (главный конфиг) для ручного `sonar-scanner` без
# обёртки. Расширить набор корней — STABLE_ROOTS в sonar_sources.py (GROWING_PARENTS пуст).
sonar.sources=ИБTransportManagementDevelop/Конфигурация
sonar.sourceEncoding=UTF-8
sonar.language=bsl

# Exclude non-BSL files and docs with long paths (>400 char key limit)
sonar.exclusions=**/docs/**,**/*.md,**/*.xml,**/*.json,**/*.cf,**/*.cfe,**/*.pkl

# G19 (ADR-021): внешний BSL-LS отчёт УБРАН — плагин communitybsl 1.18.1 гоняет
# bsl-language-server ВСТРОЕННО (Sensor BSL Core, verified 2026-06-15). Внешний reportPath
# дублировал бы анализ. CI-шаг «Run BSL LS» оставлен только ради human-readable artifact.
# sonar.bsl.languageserver.reportPath=build/bsl-report/bsl-json.json

# Code coverage — ОТЛОЖЕНО до разблокировки Coverage41C (ADR-020 BLOCKED: EDT debug-плагины)
# sonar.coverageReportPaths=build/reports/coverage.xml
