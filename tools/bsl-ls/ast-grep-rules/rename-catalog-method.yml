# R0.3 Rule 3: Match catalog module method calls in BSL (Module.Method pattern)
# Uses kind-based matching for call_expression nodes with access + method_call
# AST: call_expression -> [access -> identifier($MODULE), ., method_call -> [identifier($METHOD), arguments]]
id: rename-catalog-method
language: bsl
rule:
  kind: call_expression
  has:
    kind: access
message: "Qualified method call found - candidate for rename"
severity: hint
note: |
  Matches all qualified method calls (Module.Method pattern) via call_expression with access child.
  For rename: target the identifier inside method_call.
  Test target: ТестоваяУтилита.ПолучитьПараметр, ТестоваяУтилита.УстановитьПараметр in ТестовыйВызыватель
