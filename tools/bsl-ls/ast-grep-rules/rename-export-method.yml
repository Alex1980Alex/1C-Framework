# R0.3 Rule 1: Match exported BSL methods (functions and procedures with Экспорт)
# Uses kind-based matching because BSL tree-sitter doesn't support $metavars in patterns well
# AST function: function_definition -> [FUNCTION_KEYWORD, identifier, parameters, EXPORT_KEYWORD, ...body, ENDFUNCTION_KEYWORD]
# AST procedure: procedure_definition -> [PROCEDURE_KEYWORD, identifier, parameters, EXPORT_KEYWORD, ...body, ENDPROCEDURE_KEYWORD]
id: rename-export-method
language: bsl
rule:
  anyOf:
    - kind: function_definition
      has:
        kind: EXPORT_KEYWORD
    - kind: procedure_definition
      has:
        kind: EXPORT_KEYWORD
message: "Exported method found - candidate for rename"
severity: hint
note: |
  Matches all exported BSL functions and procedures (containing EXPORT_KEYWORD).
  For rename: target the 'identifier' child after FUNCTION/PROCEDURE_KEYWORD.
  Test targets: ПолучитьПараметр (func), УстановитьПараметр (proc) in ТестоваяУтилита
