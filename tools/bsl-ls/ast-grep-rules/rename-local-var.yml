# R0.3 Rule 2: Match local variable assignments in BSL
# Uses kind-based matching for assignment_statement nodes
# AST: assignment_statement -> [identifier($VAR), =, expression, ;]
id: rename-local-var
language: bsl
rule:
  kind: assignment_statement
message: "Local variable assignment found - candidate for rename"
severity: hint
note: |
  Matches all BSL assignment statements.
  For rename: target the first 'identifier' child of the assignment_statement.
  Test target: Значение = ТестоваяУтилита.ПолучитьПараметр("ключ") in ТестовыйВызыватель (line 1)
