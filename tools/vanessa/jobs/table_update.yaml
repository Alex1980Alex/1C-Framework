# table_update.yaml — регламент "Путь Б" для обновления электронных табло (GKSTCPLK).
#
# Обходит БСП-защиту "БлокировкаРаботыСВнешнимиРесурсами", которая автоматически
# отключает регламентные задания при копировании базы (testdb1c — копия PROD).
#
# Вызывается из trigger-reglament.py через --job table_update (по умолчанию)
# или напрямую через VA BDD шаг "И я запускаю команду ОС powershell -File trigger-reglament.ps1".

name: гкс_ОбновлениеТаблоЭлектроннойОчереди
description: Путь Б — обновление регистра гкс_ЭлектронныеТабло из очереди приёмки
bsl: |
  БлокировкаРаботыСВнешнимиРесурсами.РазрешитьРаботуСВнешнимиРесурсами();
  гкс_ЭлектроннаяОчередь.ОбновлениеТаблоЭлектроннойОчереди();
